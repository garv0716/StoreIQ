version: "3.8"

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda

    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092

    ports:
      - "9092:9092"

  api:
    image: python:3.11-slim
    container_name: store-intelligence-api

    working_dir: /app

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    environment:
      - PYTHONUNBUFFERED=1

    command: >
      bash -c "pip install
      fastapi
      uvicorn
      pydantic
      python-dotenv
      groq
      pandas
      numpy
      requests
      kafka-python
      pytest
      httpx
      --quiet &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

    depends_on:
      - redpanda

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3